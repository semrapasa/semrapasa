name: Generate T-Rex Runner Animation

on:
  # Her kod yüklediğinde veya dosya değiştirdiğinde de tetiklenir
  push:
    branches:
      - main
      - master
  
  # Her gece gece yarısı otomatik çalışır
  schedule:
    - cron: "0 0 * * *"
    
  # İstediğinde elle tetiklemek istersen
  workflow_dispatch:

# ... kodun geri kalanı aynen kalacak ...

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # 2. Adımda tanımladığımız gizli şifre
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Çıktı ayarları
          filename: github-dino-t-rex.svg
          base: ""
          
          # T-Rex / Dino eklentisi aktif ediliyor
          plugin_anilist: no
          plugin_introduction: no
          
          # Haftalık aktiviteni kaktüslere dönüştürür
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
