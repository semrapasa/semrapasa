name: Generate T-Rex Runner Animation

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-dino-t-rex.svg
          base: ""
          
          # Takvimi ve T-Rex animasyon modunu zorla aktif ediyoruz
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # İŞTE SİHİRLİ DOKUNUŞ: SVG'nin içine T-Rex karakterini ve oyun tasarımını enjekte ediyoruz
          config_order: plugin_isocalendar
          custom_css: |
            .isocalendar-box {
              position: relative;
            }
            /* Takvimin önüne emektar dinomuzu yerleştiriyoruz */
            .isocalendar-box::before {
              content: "🦖";
              position: absolute;
              bottom: 15px;
              left: 20px;
              font-size: 28px;
              animation: dinoJump 2.5s infinite steps(2);
              z-index: 10;
            }
            /* Dinonun kaktüslerin (yeşil kutuların) üzerinden atlama animasyonu */
            @keyframes dinoJump {
              0%, 100% { transform: translateY(0); }
              50% { transform: translateY(-35px); }
            }
